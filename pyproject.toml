[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuke-codex-panel"
version = "0.1.0.dev0"
description = "A dockable Codex client for Foundry Nuke"
requires-python = ">=3.11"

[project.scripts]
nuke-codex-mcp = "nuke_codex_panel.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["nuke_codex_panel", "nuke_codex_panel.*"]

[tool.setuptools.package-data]
"nuke_codex_panel.knowledge" = [
    "SKILL.md",
    "fundamentals/*.md",
    "topics/*.md",
    "nodes/*.md",
    "sources/*.json",
    "coverage.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
